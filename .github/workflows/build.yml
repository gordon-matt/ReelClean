name: Build ReelClean

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test ReelClean.slnx --configuration Release

  publish:
    name: Build ${{ matrix.rid }}
    needs: test
    if: github.event_name != 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        shell: bash
        run: >
          dotnet publish ReelClean/ReelClean.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}

      - name: Pack archive
        shell: bash
        run: tar -a -c -f ReelClean-${{ matrix.rid }}.zip -C publish/${{ matrix.rid }} .

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ReelClean-${{ matrix.rid }}
          path: ReelClean-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Attach builds to GitHub release
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: ReelClean-*
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -t files < <(find dist -type f -name '*.zip' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release archives were found under dist:"
            find dist -print
            exit 1
          fi
          printf 'Uploading:\n'
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GH_REPO" --clobber
